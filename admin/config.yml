# Configuracao do painel de edicao (Decap CMS).
# Backend: GitHub OAuth, autenticado por worker/index.js (rota /api/auth do
# Cloudflare Worker que serve o site). Ao gravar aqui, faz-se commit
# automatico no repositorio e o Cloudflare republica o site sozinho.

backend:
  name: github
  repo: tiagooliveirarvilar-beep/portfolio
  branch: main
  base_url: https://portfolio.tiagooliveirarvilar.workers.dev
  auth_endpoint: api/auth

# So tem efeito em localhost (com "npx decap-server" a correr), para poder
# testar o painel sem estar publicado. Em producao e ignorado.
local_backend: true

# URL do site publicado no Cloudflare Pages
site_url: https://portfolio.tiagooliveirarvilar.workers.dev/
display_url: https://portfolio.tiagooliveirarvilar.workers.dev/

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "pt"

collections:
  # Cada projeto e uma ficha propria em content/projetos/, aberta em pagina
  # inteira — sem listas dentro de listas. O nome do ficheiro e o endereco da
  # pagina do projeto no site.
  #
  # A ordem da home vem da DATA, do mais recente para o mais antigo. O numero
  # a esquerda (01, 02...) e calculado sozinho, sendo 01 o mais antigo.
  #
  # O site le content/projetos.json, que e reconstruido sozinho a partir
  # destas fichas pelo GitHub Actions (.github/workflows/gerar-lista.yml).
  - name: "projetos"
    label: "Projetos"
    label_singular: "Projeto"
    folder: "content/projetos"
    create: true
    delete: true
    identifier_field: "titulo"
    extension: "json"
    format: "json"
    slug: "{{titulo}}"
    summary: "{{titulo}} — {{data}}"
    sortable_fields: ["data", "titulo"]
    editor:
      preview: false
    fields:
      - { label: "Título (sempre em minúsculas)", name: "titulo", widget: "string", pattern: ['^[^A-ZÀ-Ý]*$', "Usa só minúsculas, mesmo na primeira letra."] }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM", date_format: "MMMM [de] YYYY", time_format: false, required: false, hint: "Decide a posição na home: mais recente primeiro." }
      - { label: "Projeto em curso", name: "emCurso", widget: "boolean", default: false, hint: "Se ligado, a home mostra 'em curso' em vez da data." }
      - { label: "Categoria", name: "categoria", widget: "categoria", required: false, hint: "Escolhe da lista ou escreve uma categoria nova." }
      - { label: "Imagem de capa", name: "capa", widget: "recorte", required: false, forcarQuadrado: true, hint: "A capa é sempre quadrada." }
      - { label: "Imagens do projeto", name: "imagens", widget: "galeria", required: false, hint: "\"Adicionar fotos\" permite escolher várias imagens do computador de uma vez. Recorte livre: escolhe a parte que interessa, com a altura que quiseres — na página saem todas com a mesma largura, centradas." }
      - { label: "Descrição curta (ficha técnica)", name: "descricao", widget: "text", required: false }
      - { label: "Local", name: "local", widget: "string", required: false }
      - { label: "Período (ex. 2024/2025)", name: "periodo", widget: "string", required: false }
      - { label: "Disciplina / tipo", name: "disciplina", widget: "string", required: false }
      - { label: "Área", name: "area", widget: "string", required: false }
      - { label: "Colaboração", name: "colaboracao", widget: "string", required: false }
      - { label: "Fotografia (créditos)", name: "fotografia", widget: "string", required: false }
      - { label: "Orientação", name: "orientacao", widget: "string", required: false }

  - name: "sobre"
    label: "Sobre Mim"
    files:
      - name: "sobre"
        label: "Sobre Mim"
        file: "content/sobre.json"
        editor:
          preview: false
        fields:
          - { label: "Foto (retrato)", name: "foto", widget: "image", required: false }
          - { label: "Texto", name: "texto", widget: "text" }

  - name: "contacto"
    label: "Contacto"
    files:
      - name: "contacto"
        label: "Contacto"
        file: "content/contacto.json"
        editor:
          preview: false
        fields:
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Telefone", name: "telefone", widget: "string", required: false }
          - { label: "Local", name: "local", widget: "string", required: false, hint: "ex. porto, portugal" }
