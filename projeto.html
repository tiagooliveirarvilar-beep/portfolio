<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiago Oliveira Ribeiro Vilar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Titulo verdadeiramente fixo: nunca se move enquanto as imagens passam.
     Tambem serve de regresso a home. -->
<a class="projeto-titulo" id="titulo" href="index.html"></a>

<div class="pagina-projeto">
  <div class="conteudo">
    <div class="galeria" id="galeria"></div>
    <div class="ficha" id="ficha"></div>
  </div>
</div>

<div class="lightbox" id="lightbox"><span class="recorte lightbox__foto"></span></div>

<!-- Marca fixa: presente em todas as paginas, sempre a frente -->
<button type="button" class="marca" id="marca" aria-expanded="false" aria-controls="perfil">Tiago Vilar</button>

<section class="perfil" id="perfil" hidden>
  <img class="perfil__foto" id="sobre-foto" alt="" hidden>
  <div class="perfil__conteudo">
    <div class="perfil__contacto">
      <p class="etiqueta">contacto</p>
      <ul id="contacto-lista"></ul>
    </div>
    <div class="perfil__sobre">
      <p class="etiqueta">sobre mim</p>
      <p id="sobre-texto"></p>
    </div>
  </div>
</section>

<script src="js/conteudo.js"></script>
<script src="js/projeto.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
