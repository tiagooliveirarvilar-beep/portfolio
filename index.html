<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiago Oliveira Ribeiro Vilar</title>
<meta name="description" content="Portefolio de Tiago Oliveira Ribeiro Vilar — arquitetura e outros trabalhos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Projetos: cronologia, mais recente primeiro -->
<main id="projetos"></main>

<!-- Marca fixa: unica navegacao do site, abre o ecra de Sobre Mim + Contacto -->
<button type="button" class="marca" id="marca" aria-expanded="false" aria-controls="perfil">Tiago Vilar</button>

<!-- Sobre Mim + Contacto: um ecra sem scroll, fora da cronologia -->
<section class="perfil" id="perfil" hidden>
  <img class="perfil__foto" id="sobre-foto" alt="" hidden>
  <div class="perfil__conteudo">
    <div class="perfil__contacto">
      <p class="etiqueta">contacto</p>
      <ul id="contacto-lista"></ul>
    </div>
    <div class="perfil__sobre">
      <p class="etiqueta">sobre mim</p>
      <p id="sobre-texto"></p>
    </div>
  </div>
</section>

<script src="js/conteudo.js"></script>
<script src="js/home.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
