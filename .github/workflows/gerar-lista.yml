# Sempre que uma ficha de projeto e gravada no painel /admin, este workflow
# reconstroi content/projetos.json — o ficheiro unico que o site le.
#
# Porque e preciso: um site estatico nao consegue "ver" que ficheiros existem
# numa pasta, por isso a lista tem de ser escrita para um ficheiro.
#
# Nao ha risco de ciclo infinito: isto so dispara com alteracoes dentro de
# content/projetos/ e o que ele grava e content/projetos.json, que esta fora
# dessa pasta e por isso nao volta a disparar o workflow.

name: Gerar lista de projetos

on:
  push:
    branches: [main]
    paths:
      - 'content/projetos/**'
      - 'scripts/gerar-lista.js'
  workflow_dispatch:

# Evita que duas gravacoes seguidas no painel se atropelem.
concurrency:
  group: gerar-lista
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar content/projetos.json
        run: node scripts/gerar-lista.js

      - name: Gravar se houver alteracoes
        run: |
          if git diff --quiet -- content/projetos.json; then
            echo "Lista sem alteracoes; nada a gravar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projetos.json
          git commit -m "Atualizar lista de projetos (automatico)"

          # Se duas gravacoes no painel disparam este workflow em poucos
          # segundos, o push pode chegar depois de outro commit ja ter
          # mudado o main (o concurrency acima serializa as execucoes deste
          # workflow, mas nao impede um push direto do painel de entrar no
          # meio). Sem isto, esse push falhava e ficava tudo por gravar ate
          # a proxima edicao por acaso disparar tudo de novo — era isto que
          # fazia o site nao atualizar de vez em quando. Agora tenta-se de
          # novo, buscando o commit novo e reconstruindo a lista outra vez
          # em cima dele.
          for tentativa in 1 2 3 4 5; do
            if git push; then
              echo "Publicado."
              exit 0
            fi
            echo "Push falhou (tentativa $tentativa); a sincronizar com o remoto e a tentar de novo."
            git fetch origin main
            git reset --soft origin/main
            node scripts/gerar-lista.js
            if git diff --quiet -- content/projetos.json; then
              echo "Depois de sincronizar, a lista ja estava atualizada por outra execucao."
              exit 0
            fi
            git add content/projetos.json
            git commit -m "Atualizar lista de projetos (automatico)"
          done
          echo "Nao consegui publicar depois de 5 tentativas."
          exit 1
